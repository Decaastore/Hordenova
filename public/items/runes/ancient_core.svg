<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="wood" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#8a5a32"/>
      <stop offset="0.55" stop-color="#4e3018"/>
      <stop offset="1" stop-color="#1e1208"/>
    </radialGradient>
    <radialGradient id="heart" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.3" stop-color="#7ff0d8"/>
      <stop offset="0.7" stop-color="#2ab8a0" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#0a5a50" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="body"><path d="M128 22 C178 26 214 70 214 128 C214 190 176 234 128 234 C78 234 42 192 42 130 C42 70 80 20 128 22 Z"/></clipPath>
  </defs>
  <!-- the pulse that leaks out -->
  <circle cx="128" cy="128" r="96" fill="url(#heart)" opacity="0.35" filter="url(#blur)"/>
  <!-- heartwood body -->
  <path d="M128 22 C178 26 214 70 214 128 C214 190 176 234 128 234 C78 234 42 192 42 130 C42 70 80 20 128 22 Z" fill="url(#wood)" stroke="#140b04" stroke-width="5"/>
  <!-- growth rings -->
  <g clip-path="url(#body)" fill="none" stroke="#2a180a" stroke-width="3" opacity="0.75">
    <ellipse cx="124" cy="136" rx="30" ry="36"/>
    <ellipse cx="124" cy="136" rx="52" ry="62"/>
    <ellipse cx="124" cy="136" rx="74" ry="86"/>
    <ellipse cx="124" cy="136" rx="96" ry="110"/>
  </g>
  <g clip-path="url(#body)" fill="none" stroke="#a87444" stroke-width="1.6" opacity="0.45">
    <ellipse cx="122" cy="132" rx="41" ry="49"/>
    <ellipse cx="122" cy="132" rx="63" ry="74"/>
  </g>
  <!-- the glowing heart -->
  <ellipse cx="124" cy="136" rx="24" ry="28" fill="url(#heart)"/>
  <!-- cracks that carry the light -->
  <g filter="url(#glow)" fill="none" stroke="#8ff6e0" stroke-linecap="round" stroke-linejoin="round">
    <path d="M124 110 L112 82 L120 60 L108 34" stroke-width="5"/>
    <path d="M146 140 L176 128 L190 146 L208 140" stroke-width="4.5"/>
    <path d="M118 162 L104 190 L114 214" stroke-width="4.5"/>
    <path d="M102 128 L74 118 L58 132" stroke-width="3.5"/>
    <path d="M112 82 L94 76" stroke-width="2.5"/>
    <path d="M176 128 L182 108" stroke-width="2.5"/>
  </g>
  <g fill="none" stroke="#fffbe8" stroke-linecap="round" stroke-width="1.6" opacity="0.9">
    <path d="M124 110 L112 82 L120 60 L108 34"/>
    <path d="M146 140 L176 128 L190 146 L208 140"/>
    <path d="M118 162 L104 190 L114 214"/>
  </g>
  <!-- bark rim highlight -->
  <path d="M86 52 C100 38 116 32 132 32" stroke="#c89664" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.6"/>
  <!-- sparks -->
  <g fill="#c8fff2"><circle cx="196" cy="88" r="3"/><circle cx="60" cy="96" r="2.4"/><circle cx="170" cy="214" r="2.6"/></g>
</svg>
