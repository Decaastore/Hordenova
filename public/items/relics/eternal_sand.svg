<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="aura" cx="50%" cy="55%" r="50%">
      <stop offset="0" stop-color="#ffd878" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#8a4aff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8a4aff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vial" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5a2ab8" stop-opacity="0.75"/>
      <stop offset="0.35" stop-color="#e8dcff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3a1478" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="0.5" stop-color="#ffd060"/>
      <stop offset="1" stop-color="#c07818"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.5" stop-color="#e0a83a"/>
      <stop offset="1" stop-color="#6a4410"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="140" r="118" fill="url(#aura)"/>
  <!-- the vial -->
  <path d="M104 70 L104 104 C76 118 64 146 64 170 C64 208 94 232 128 232 C162 232 192 208 192 170 C192 146 180 118 152 104 L152 70 Z" fill="url(#vial)" stroke="#e8dcff" stroke-opacity="0.85" stroke-width="2.5"/>
  <!-- golden sand inside, glowing -->
  <path d="M70 176 C82 160 104 166 128 158 C152 150 174 158 186 170 C186 204 160 226 128 226 C96 226 70 206 70 176 Z" fill="url(#sand)"/>
  <g fill="#fff8d8">
    <circle cx="104" cy="186" r="2.2"/><circle cx="140" cy="176" r="1.8"/><circle cx="160" cy="196" r="2.4"/><circle cx="118" cy="206" r="1.6"/><circle cx="92" cy="200" r="1.4"/>
  </g>
  <!-- sand grains floating up out of it -->
  <g fill="#ffd878">
    <circle cx="122" cy="140" r="2.6"/><circle cx="136" cy="124" r="2"/><circle cx="118" cy="112" r="1.6"/><circle cx="132" cy="96" r="1.4" fill="#d8b0ff"/>
    <circle cx="142" cy="146" r="1.6" fill="#d8b0ff"/>
  </g>
  <path d="M82 148 C76 166 78 186 90 202" stroke="#ffffff" stroke-opacity="0.55" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- gold neck and stopper -->
  <rect x="96" y="58" width="64" height="16" rx="5" fill="url(#gold)" stroke="#5a3a08" stroke-width="2"/>
  <path d="M110 58 L110 38 C110 28 146 28 146 38 L146 58 Z" fill="#3a1a6a" stroke="#ffd878" stroke-width="2.5"/>
  <circle cx="128" cy="30" r="9" fill="#b07aff" stroke="#ffe08a" stroke-width="3"/>
  <!-- a little hourglass sigil on the glass -->
  <path d="M118 120 L138 120 L128 132 L138 144 L118 144 L128 132 Z" fill="none" stroke="#ffe08a" stroke-width="2.5" stroke-linejoin="round"/>
</svg>
