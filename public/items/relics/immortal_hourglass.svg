<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#c08aff" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#6a2ae8" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#6a2ae8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.45" stop-color="#e8b84a"/>
      <stop offset="1" stop-color="#7a5212"/>
    </linearGradient>
    <linearGradient id="goldSide" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a5212"/>
      <stop offset="0.5" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#8a6018"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efe2ff" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#9a6aff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4a1aa8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6c8"/>
      <stop offset="1" stop-color="#e0a030"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="122" fill="url(#aura)"/>
  <!-- star orbits -->
  <g fill="none" stroke-width="2.2">
    <ellipse cx="128" cy="128" rx="104" ry="34" transform="rotate(-28 128 128)" stroke="#c08aff" stroke-opacity="0.75"/>
    <ellipse cx="128" cy="128" rx="100" ry="28" transform="rotate(32 128 128)" stroke="#ffd878" stroke-opacity="0.7"/>
  </g>
  <g fill="#ffffff">
    <path d="M38 166 l3 -8 3 8 8 3 -8 3 -3 8 -3 -8 -8 -3z"/>
    <path d="M214 92 l2.4 -6.4 2.4 6.4 6.4 2.4 -6.4 2.4 -2.4 6.4 -2.4 -6.4 -6.4 -2.4z"/>
    <path d="M206 186 l2 -5 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2z" fill="#ffd878"/>
    <path d="M52 74 l2 -5 2 5 5 2 -5 2 -2 5 -2 -5 -5 -2z" fill="#d8b0ff"/>
  </g>
  <!-- glass bulbs -->
  <path d="M86 52 C86 92 118 112 124 128 C118 144 86 164 86 204 L170 204 C170 164 138 144 132 128 C138 112 170 92 170 52 Z" fill="url(#glass)" stroke="#e8dcff" stroke-opacity="0.8" stroke-width="2"/>
  <!-- sand: what's left above, the stream, the pile below -->
  <path d="M100 84 C104 102 120 114 126 124 L130 124 C136 114 152 102 156 84 Z" fill="url(#sand)" opacity="0.95"/>
  <rect x="126.6" y="124" width="2.8" height="58" fill="#fff0b0"/>
  <path d="M94 204 C100 184 116 176 128 174 C140 176 156 184 162 204 Z" fill="url(#sand)"/>
  <path d="M104 64 C102 76 104 88 110 98" stroke="#ffffff" stroke-opacity="0.7" stroke-width="3" fill="none" stroke-linecap="round"/>
  <!-- gold frame -->
  <rect x="70" y="34" width="116" height="18" rx="6" fill="url(#gold)" stroke="#5a3a08" stroke-width="2"/>
  <rect x="70" y="204" width="116" height="18" rx="6" fill="url(#gold)" stroke="#5a3a08" stroke-width="2"/>
  <rect x="76" y="50" width="9" height="156" rx="4" fill="url(#goldSide)" stroke="#5a3a08" stroke-width="1.5"/>
  <rect x="171" y="50" width="9" height="156" rx="4" fill="url(#goldSide)" stroke="#5a3a08" stroke-width="1.5"/>
  <circle cx="80.5" cy="128" r="7" fill="#b07aff" stroke="#ffe08a" stroke-width="2.5"/>
  <circle cx="175.5" cy="128" r="7" fill="#b07aff" stroke="#ffe08a" stroke-width="2.5"/>
  <!-- crown on top -->
  <path d="M100 34 L104 16 L116 26 L128 10 L140 26 L152 16 L156 34 Z" fill="url(#gold)" stroke="#5a3a08" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="128" cy="10" r="4.5" fill="#d8b0ff"/>
  <circle cx="104" cy="16" r="3.2" fill="#d8b0ff"/>
  <circle cx="152" cy="16" r="3.2" fill="#d8b0ff"/>
</svg>
